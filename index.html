<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amarante&family=Birthstone&family=Faculty+Glyphic&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section>
      <div class="cardContainer">
        <h1>My Tasks</h1>
        <p>Stay organized and productive</p>
        <div class="inputDiv">
          <input
            type="text"
            name=""
            id="inputText"
            placeholder="What needs to be done?"
          /><button id="addBtn">Add Task</button>
        </div>
        <div class="listContainer">
          <ul id="unorderList">
            <li class="eachList">
              <div class="textDiv">
                <input type="checkbox" name="" id="" /> Instagram post bedenken
              </div>
              <button id="delBtn" class="delBtn">Delete</button>
            </li>
          </ul>
        </div>
        <div class="lastDiv">
          <div>3 tasks</div>
          <div>0 completed</div>
        </div>
      </div>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
